<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microphone Permission and Function Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button { padding: 10px 15px; margin: 5px; }
        #volumeMeter { width: 300px; height: 20px; background: #eee; border: 1px solid #ccc; }
        #volumeBar { height: 100%; background: linear-gradient(to right, green, yellow, red); width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>
    <h1>🎤 Microphone Diagnostic Tool</h1>
    
    <div class="test-section">
        <h3>1. Permission Check</h3>
        <button onclick="checkPermissions()">Check Microphone Permission</button>
        <div id="permissionResult"></div>
    </div>

    <div class="test-section">
        <h3>2. Device Check</h3>
        <button onclick="listAudioDevices()">List Audio Devices</button>
        <div id="deviceResult"></div>
    </div>

    <div class="test-section">
        <h3>3. Audio Stream Test</h3>
        <button onclick="testAudioStream()">Test Audio Stream</button>
        <button onclick="stopAudioStream()">Stop Test</button>
        <div id="streamResult"></div>
        <div>Volume Monitoring:</div>
        <div id="volumeMeter"><div id="volumeBar"></div></div>
        <div>Volume Value: <span id="volumeValue">0%</span></div>
    </div>

    <div class="test-section">
        <h3>4. WebRTC Test</h3>
        <button onclick="testWebRTC()">Test WebRTC Audio</button>
        <div id="webrtcResult"></div>
    </div>

    <script>
        let currentStream = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;

        // 1. Check permissions
        async function checkPermissions() {
            const result = document.getElementById('permissionResult');
            result.innerHTML = 'Checking...';
            
            try {
                // Check Permissions API
                if ('permissions' in navigator) {
                    const permission = await navigator.permissions.query({ name: 'microphone' });
                    result.innerHTML = `<div class="success">Permission status: ${permission.state}</div>`;
                    
                    if (permission.state === 'denied') {
                        result.innerHTML += '<div class="error">❌ Microphone permission denied. Please allow microphone access in browser settings.</div>';
                    }
                } else {
                    result.innerHTML = '<div class="warning">This browser does not support the Permissions API. Will try to access the microphone directly.</div>';
                }

                // Check secure context
                if (!window.isSecureContext) {
                    result.innerHTML += '<div class="error">❌ Not a secure context (HTTPS). Microphone may not be available.</div>';
                } else {
                    result.innerHTML += '<div class="success">✅ Secure context is available</div>';
                }

                // Check getUserMedia support
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    result.innerHTML += '<div class="error">❌ Browser does not support getUserMedia</div>';
                } else {
                    result.innerHTML += '<div class="success">✅ getUserMedia is supported</div>';
                }

            } catch (error) {
                result.innerHTML = `<div class="error">Permission check failed: ${error.message}</div>`;
            }
        }

        // 2. List audio devices
        async function listAudioDevices() {
            const result = document.getElementById('deviceResult');
            result.innerHTML = 'Getting device list...';
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                
                if (audioInputs.length === 0) {
                    result.innerHTML = '<div class="error">❌ No audio input devices found</div>';
                } else {
                    let html = '<div class="success">✅ Audio input devices found:</div><ul>';
                    audioInputs.forEach((device, index) => {
                        html += `<li>${index + 1}. ${device.label || 'Unknown device'} (${device.deviceId.substring(0, 8)}...)</li>`;
                    });
                    html += '</ul>';
                    result.innerHTML = html;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Failed to get device list: ${error.message}</div>`;
            }
        }

        // 3. Test audio stream
        async function testAudioStream() {
            const result = document.getElementById('streamResult');
            result.innerHTML = 'Getting audio stream...';
            
            try {
                // Stop previous stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                // Get audio stream using the same config as your project
                currentStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 48000,
                        channelCount: 2,
                        volume: 1.0,
                    },
                    video: false,
                });

                const track = currentStream.getAudioTracks()[0];
                if (track) {
                    result.innerHTML = `<div class="success">✅ Audio stream acquired successfully</div>`;
                    result.innerHTML += `<div>Track ID: ${track.id}</div>`;
                    result.innerHTML += `<div>Track state: ${track.readyState}</div>`;
                    result.innerHTML += `<div>Track label: ${track.label}</div>`;
                    
                    const settings = track.getSettings();
                    result.innerHTML += `<div>Sample rate: ${settings.sampleRate}Hz</div>`;
                    result.innerHTML += `<div>Channel count: ${settings.channelCount}</div>`;
                    
                    // Start volume monitoring
                    startVolumeMonitoring(currentStream);
                } else {
                    result.innerHTML = '<div class="error">❌ Failed to get audio track</div>';
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Failed to acquire audio stream: ${error.message}</div>`;
                if (error.name === 'NotAllowedError') {
                    result.innerHTML += '<div class="error">Please allow microphone permission and refresh the page to try again.</div>';
                }
            }
        }

        // Volume monitoring
        function startVolumeMonitoring(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                source.connect(analyser);
                
                function updateVolume() {
                    analyser.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    const average = sum / bufferLength;
                    const volumePercent = Math.round((average / 255) * 100);
                    
                    document.getElementById('volumeBar').style.width = volumePercent + '%';
                    document.getElementById('volumeValue').textContent = volumePercent + '%';
                    
                    animationId = requestAnimationFrame(updateVolume);
                }
                
                updateVolume();
            } catch (error) {
                console.error('Failed to start volume monitoring:', error);
            }
        }

        // Stop audio stream
        function stopAudioStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('volumeBar').style.width = '0%';
            document.getElementById('volumeValue').textContent = '0%';
            document.getElementById('streamResult').innerHTML = 'Audio stream stopped';
        }

        // 4. WebRTC test
        async function testWebRTC() {
            const result = document.getElementById('webrtcResult');
            result.innerHTML = 'Testing WebRTC audio processing...';
            
            try {
                // Create PeerConnection
                const pc = new RTCPeerConnection();
                
                // Reserve audio send channel (simulate your project)
                const audioTransceiver = pc.addTransceiver("audio", { direction: "sendonly" });
                result.innerHTML += '<div class="success">✅ Audio send channel reserved</div>';
                
                // Get audio stream
                if (!currentStream) {
                    await testAudioStream();
                }
                
                if (currentStream) {
                    const track = currentStream.getAudioTracks()[0];
                    
                    // Use replaceTrack (simulate your project logic)
                    await audioTransceiver.sender.replaceTrack(track);
                    result.innerHTML += '<div class="success">✅ replaceTrack executed successfully</div>';
                    
                    // Check sender status
                    const sender = audioTransceiver.sender;
                    result.innerHTML += `<div>Sender track ID: ${sender.track?.id || 'null'}</div>`;
                    result.innerHTML += `<div>Sender track state: ${sender.track?.readyState || 'null'}</div>`;
                    result.innerHTML += `<div>Transceiver direction: ${audioTransceiver.direction}</div>`;
                    result.innerHTML += `<div>Transceiver current direction: ${audioTransceiver.currentDirection || 'null'}</div>`;
                } else {
                    result.innerHTML += '<div class="error">❌ Failed to get audio stream for WebRTC test</div>';
                }
                
                // Cleanup
                setTimeout(() => {
                    pc.close();
                }, 1000);
                
            } catch (error) {
                result.innerHTML += `<div class="error">WebRTC test failed: ${error.message}</div>`;
            }
        }

        // Automatically check permissions on page load
        window.onload = function() {
            checkPermissions();
        };
    </script>
</body>
</html>
